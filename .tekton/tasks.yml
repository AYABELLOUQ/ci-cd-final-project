apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
  labels:
    app.kubernetes.io/part-of: ci-cd-final-project
spec:
  description: Remove files from the shared source workspace before cloning.
  workspaces:
    - name: source
      description: Workspace containing the application source code.
  steps:
    - name: clean-workspace
      image: alpine:3.20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Cleaning the shared source workspace..."
        find . -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf -- {} +
        echo "Cleanup complete."
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
  labels:
    app.kubernetes.io/part-of: ci-cd-final-project
spec:
  description: Install Python dependencies and run the unit test suite with Nose.
  workspaces:
    - name: source
      description: Workspace containing the application and its tests.
  steps:
    - name: run-unit-tests
      image: python:3.10-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        nosetests -v --with-spec --spec-color
