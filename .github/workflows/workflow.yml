name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 --max-line-length=100 service tests

      - name: Run unit tests with nose
        run: |
          # Nose 1.3.7 requires the deprecated collections.Callable alias on Python 3.10
          python -c 'import collections, collections.abc; collections.Callable = collections.abc.Callable; import nose; nose.run_exit()' -v --with-spec --spec-color
